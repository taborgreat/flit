[package]
name = "flit-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
flit-core.workspace = true
serde.workspace = true
postcard.workspace = true
thiserror.workspace = true
interprocess.workspace = true
tokio.workspace = true
dirs.workspace = true
tracing.workspace = true

# Client::drop cancels the reader thread's blocking pipe read (a thread
# still running when a DAW unloads the plugin crashes the DAW).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO"] }

[dev-dependencies]
tempfile.workspace = true
